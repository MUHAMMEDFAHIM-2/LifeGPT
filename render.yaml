services:
  - name: lifegpt-api
    type: web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Neon/Supabase Postgres connection string
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false # raw base64url key, NOT the .pem file
      - key: VAPID_CLAIM_EMAIL
        sync: false
      - key: REMINDER_MODE
        value: external # GitHub Actions triggers the reminder instead
      - key: CRON_SECRET
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: EXTRA_CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://lifegpt.vercel.app
